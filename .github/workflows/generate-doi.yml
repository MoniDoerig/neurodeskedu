name: generate-doi

on:
    schedule:
        - cron: '0 0 1 * *' # Every month on the first day at midnight
    workflow_dispatch:

jobs:
    get-updated-notebooks:
        runs-on: ubuntu-22.04
        outputs:
            updated_notebooks_list: ${{ steps.list_notebooks.outputs.updated_notebooks_list }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - name: Check for notebooks to publish to Zenodo
              id : list_notebooks
              run: |
                # Get the list of new or updated notebooks by comparing the checksum of notebooks from github and zenodo
                echo "Comparing checksum notebooks from GH repo and zenodo..."
                UPDATED_NOTEBOOKS=$(python .github/scripts/get-updated-notebooks.py --zenodo_token ${{ secrets.ZENODO_TOKEN }}) || true
                if [ -z "$UPDATED_NOTEBOOKS" ]; then
                  UPDATED_NOTEBOOKS="[]"
                fi
                echo "updated_notebooks_list" $UPDATED_NOTEBOOKS
                echo "updated_notebooks_list=${UPDATED_NOTEBOOKS}" >> $GITHUB_OUTPUT

    publish-doi:
      needs: get-updated-notebooks
      runs-on: ubuntu-22.04
      if: ${{ needs.get-updated-notebooks.outputs.updated_notebooks_list != '[]' && needs.get-updated-notebooks.outputs.updated_notebooks_list != '' }}
      strategy:
          fail-fast: false
          matrix:
            notebooks: ${{ fromJSON(needs.get-updated-notebooks.outputs.updated_notebooks_list) }}
      steps:
          - name: Checkout
            uses: actions/checkout@v4
            with:
                fetch-depth: 0
          - uses: actions/setup-python@v5
            with:
              python-version: 3.8

          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              pip install requests pyyaml>=6.0.2 tqdm
          - name: Publish notebook to Zenodo
            id: publish_doi
            shell: bash
            run: |
              curl --output ".github/scripts/publish-doi.py" "https://raw.githubusercontent.com/Neurodesk/neurocommand/refs/heads/main/.github/workflows/publish-doi.py"
              echo "Upload notebook to Zenodo"
              BUILDDATE=$(date +%Y%m%d)
              echo "BUILDDATE: $BUILDDATE"
              NOTEBOOK_NAME=$(echo "${{ matrix.notebooks }}" | cut -d'/' -f4 | cut -d'.' -f1)
              echo "NOTEBOOK_NAME=$NOTEBOOK_NAME" >> $GITHUB_ENV
              NOTEBOOK_BUILDDATE="${NOTEBOOK_NAME}_${BUILDDATE}"
              sed -i "s/^        license = get_license(args.container_name, args.gh_token)/        license = 'mit'/" .github/scripts/publish-doi.py
              if DOI_URL=$(python3 .github/scripts/publish-doi.py \
                    --container_filepath="https://raw.githubusercontent.com/neurodesk/neurodeskedu/refs/heads/main/${{ matrix.notebooks }}" \
                    --container_name=${NOTEBOOK_BUILDDATE} \
                    --zenodo_token=${{ secrets.ZENODO_TOKEN }} \
                    --gh_token=${{ secrets.GITHUB_TOKEN }} | tail -n 1)
              then
                echo "DOI_URL: $DOI_URL"
              else
                echo "Failed to publish to Zenodo"
                exit 1
              fi
              # Write notebook_path|doi_url to artifact for the mapping job
              echo "${{ matrix.notebooks }}|${DOI_URL}" > "${NOTEBOOK_NAME}-doi.txt"
          - name: Upload DOI artifact
            uses: actions/upload-artifact@v4
            with:
              name: doi-${{ env.NOTEBOOK_NAME }}
              path: ${{ env.NOTEBOOK_NAME }}-doi.txt

    update-doi-mapping:
      needs: [get-updated-notebooks, publish-doi]
      runs-on: ubuntu-22.04
      steps:
        - name: Checkout main branch
          uses: actions/checkout@v4
          with:
            ref: main
            fetch-depth: 1

        - name: Download all DOI artifacts
          uses: actions/download-artifact@v4
          with:
            pattern: doi-*
            path: doi-artifacts
            merge-multiple: true

        - name: Update doi-mapping.json
          run: |
            echo "Updating doi-mapping.json with new DOI entries..."

            # Read existing mapping (or start fresh)
            if [ -f doi-mapping.json ]; then
              MAPPING=$(cat doi-mapping.json)
            else
              MAPPING="{}"
            fi

            # Process each artifact file
            for f in doi-artifacts/*-doi.txt; do
              [ -f "$f" ] || continue
              LINE=$(cat "$f")
              NOTEBOOK_PATH=$(echo "$LINE" | cut -d'|' -f1)
              DOI_URL=$(echo "$LINE" | cut -d'|' -f2)
              TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

              echo "  Adding: $NOTEBOOK_PATH -> $DOI_URL"

              MAPPING=$(echo "$MAPPING" | python3 -c "
            import json, sys
            m = json.load(sys.stdin)
            m['$NOTEBOOK_PATH'] = {'doi_url': '$DOI_URL', 'updated_at': '$TIMESTAMP'}
            json.dump(m, sys.stdout, indent=2)
            ")
            done

            echo "$MAPPING" > doi-mapping.json
            echo "Final doi-mapping.json:"
            cat doi-mapping.json

        - name: Commit doi-mapping.json to main
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add doi-mapping.json
            if git diff --cached --quiet; then
              echo "No changes to doi-mapping.json"
            else
              git commit -m "Update doi-mapping.json with new DOI entries"
              git push
            fi
