# TEMPORARY diagnostic — delete after use.
#
# READ-ONLY inspection of the Zenodo account behind ZENODO_TOKEN, to establish
# whether an orphaned draft is blocking new versions of container_paths_neurodesk
# (concept 20076084 / record 21285938). Every call is a GET. Nothing is created,
# edited, published, or deleted.

name: TEMP zenodo draft inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    if: github.repository == 'neurodesk/neurodeskedu'
    runs-on: ubuntu-22.04
    steps:
      - name: Inspect depositions (READ ONLY)
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request

          tok = os.environ["ZENODO_TOKEN"]
          CONCEPT, RECORD = "20076084", "21285938"

          def get(url):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode())

          def pages():
              for p in range(1, 11):
                  try:
                      items = get(f"https://zenodo.org/api/deposit/depositions?size=100&page={p}")
                  except Exception as e:
                      print(f"  (page {p} error: {e})")
                      return
                  if not items:
                      return
                  for it in items:
                      yield it

          print("=== TARGET record", RECORD, "===")
          try:
              d = get(f"https://zenodo.org/api/deposit/depositions/{RECORD}")
              print("  title       :", str(d.get("title"))[:70])
              print("  state       :", d.get("state"), "| submitted:", d.get("submitted"))
              print("  conceptrecid:", d.get("conceptrecid"), "| doi:", d.get("doi"))
              print("  files       :", len(d.get("files") or []))
          except Exception as e:
              print("  ERROR:", e)

          print()
          print("=== ALL depositions sharing concept", CONCEPT, "===")
          n = 0
          for it in pages():
              if str(it.get("conceptrecid")) == CONCEPT:
                  n += 1
                  print(f"  id={it.get('id')}  state={it.get('state')}  submitted={it.get('submitted')}  title={str(it.get('title'))[:55]}")
          print("  matches:", n)

          print()
          print("=== ALL unsubmitted / non-done depositions in the account ===")
          m = 0
          for it in pages():
              if (not it.get("submitted")) or it.get("state") != "done":
                  m += 1
                  print(f"  id={it.get('id')}  state={it.get('state')}  submitted={it.get('submitted')}  concept={it.get('conceptrecid')}  title={str(it.get('title'))[:50]}")
          print("  draft/unsubmitted count:", m)
          PY
