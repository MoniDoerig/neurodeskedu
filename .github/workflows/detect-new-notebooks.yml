# Detect new notebooks/pages that lack an nd_review_id and automatically:
#   1. Generate a UUID
#   2. Write it into the notebook/page metadata (via PR)
#   3. Open a review issue in the reviews repo with the UUID already set
#
# CI gate: this runs after "Run Notebooks & Publish" finishes on main, not on
# the push itself, and only notebooks whose current version passed CI get
# steps 1-3 (see .github/scripts/review_ci_gate.py). A notebook that failed,
# was cancelled or has not run yet is held back with a warning. It keeps
# lacking an nd_review_id, so the first run after CI passes on main picks it
# up (re-run its failed job on that main run, or push a fix; dispatched CI
# runs do not count).
#
# This is self-contained — no round-trip dispatch needed.
# Only requires one cross-repo token: REVIEWS_REPO_TOKEN (to create issues
# in the reviews repository).

name: Detect new notebooks

on:
  # After CI finishes on main, so the gate can see each notebook's result.
  workflow_run:
    workflows: ['Run Notebooks & Publish']
    types: [completed]
    branches: [main]

  # Previous trigger, which filed review issues without waiting for CI:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'books/**/*.ipynb'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List files without creating issues or PRs'
        required: false
        default: false
        type: boolean

# A queued run can be replaced by a newer one. That is harmless: the gate looks
# back over recent CI runs, not only the one that triggered it.
concurrency:
  group: detect-new-notebooks
  cancel-in-progress: false

jobs:
  detect:
    # Only CI runs triggered by a push to main of this repo count, not dispatched
    # or fork runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read  # the CI gate reads job results of "Run Notebooks & Publish"

    steps:
      # On workflow_run this checks out the tip of main, not the CI run's head_sha.
      # That is deliberate: the gate compares each notebook here with the version CI
      # ran, so a notebook changed or deleted since is not filed on an old result,
      # and the auto-inject PR starts from current main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Find notebooks without nd_review_id
        id: scan
        run: |
          python - <<'PYEOF'
          import json, os, re, sys, glob, uuid

          # Patterns to skip (intros, templates, contribute pages)
          SKIP_PATTERNS = [
              r'/intro\.md$',
              r'/intro\.ipynb$',
              r'/contribute/',
              r'template\.ipynb$',
          ]

          def should_skip(path):
              for pat in SKIP_PATTERNS:
                  if re.search(pat, path.replace('\\', '/')):
                      return True
              return False

          def has_review_id_ipynb(path):
              try:
                  with open(path, encoding='utf-8') as f:
                      nb = json.load(f)
                  return bool(nb.get('metadata', {}).get('nd_review_id'))
              except Exception:
                  return False

          missing = []
          for path in glob.glob('books/**/*.ipynb', recursive=True):
              if should_skip(path):
                  continue
              rel = path.replace('\\', '/').removeprefix('books/')
              if not has_review_id_ipynb(path):
                  missing.append({'source_path': rel, 'review_id': str(uuid.uuid4())})

          if missing:
              print(f"Found {len(missing)} file(s) without nd_review_id:")
              for item in missing:
                  print(f"  - {item['source_path']} → {item['review_id']}")
          else:
              print("All content files have nd_review_id.")

          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
              f.write(f"missing={json.dumps(missing)}\n")
              f.write(f"count={len(missing)}\n")
          PYEOF

      # dry_run is a boolean input, so compare against true, not 'true': a boolean
      # never equals a string in expressions, so dry runs used to act for real.
      - name: Verify cross-repo token
        if: fromJSON(steps.scan.outputs.count) > 0 && inputs.dry_run != true
        env:
          HAS_TOKEN: ${{ secrets.REVIEWS_REPO_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::REVIEWS_REPO_TOKEN is not set. Cannot create issues in the reviews repo."
            exit 1
          fi

      - name: Reconcile UUIDs with existing review issues
        if: fromJSON(steps.scan.outputs.count) > 0 && inputs.dry_run != true
        id: reconcile
        uses: actions/github-script@v7
        env:
          REVIEWS_REPO_OWNER: neurodesk
          REVIEWS_REPO_NAME: neurodeskedu-reviews
          MISSING_JSON: ${{ steps.scan.outputs.missing }}
        with:
          github-token: ${{ secrets.REVIEWS_REPO_TOKEN }}
          script: |
            const missing = JSON.parse(process.env.MISSING_JSON);
            const repoOwner = process.env.REVIEWS_REPO_OWNER;
            const repoName = process.env.REVIEWS_REPO_NAME;
            const reconciled = [];

            for (const item of missing) {
              let useId = item.review_id;
              let issueExists = false;

              try {
                const results = await github.rest.search.issuesAndPullRequests({
                  q: `repo:${repoOwner}/${repoName} "${item.source_path}" in:body is:issue`,
                });

                if (results.data.total_count > 0) {
                  issueExists = true;
                  const existingBody = results.data.items[0].body || '';
                  const m = existingBody.match(
                    /<!--\s*nd-review\s*\n([\s\S]*?)-->/
                  );
                  if (m) {
                    const rid = (m[1].match(/review_id:\s*(\S+)/) || [])[1];
                    if (rid) {
                      core.info(
                        `Issue already exists for ${item.source_path} ` +
                        `with UUID ${rid} — reusing instead of ${item.review_id}`
                      );
                      useId = rid;
                    }
                  }
                }
              } catch (err) {
                core.warning(
                  `Could not check existing issues for ${item.source_path}: ${err.message}`
                );
              }

              reconciled.push({
                source_path: item.source_path,
                review_id: useId,
                issue_exists: issueExists,
              });
              await new Promise(r => setTimeout(r, 500));
            }

            core.setOutput('reconciled', JSON.stringify(reconciled));

      # CI gate: every step below works only on what this lets through. A notebook
      # with no review issue yet must have passed CI on its current version; if it
      # has not, it gets neither an issue nor an nd_review_id (an ID without an
      # issue would hide it from every later scan). Notebooks that already have
      # an issue go through for ID injection. On dry runs the reconcile step is
      # skipped, so this sees the plain scan list and just reports.
      - name: Hold back notebooks that have not passed CI
        if: fromJSON(steps.scan.outputs.count) > 0
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATES_JSON: ${{ steps.reconcile.outputs.reconciled || steps.scan.outputs.missing }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python .github/scripts/review_ci_gate.py

      - name: Inject UUIDs and create PR
        if: steps.gate.outputs.count > 0 && inputs.dry_run != true
        id: inject
        env:
          GATED_JSON: ${{ steps.gate.outputs.gated }}
        run: |
          python - <<'PYEOF'
          import json, os, re

          missing = json.loads(os.environ['GATED_JSON'])
          modified = []

          for item in missing:
              review_id = item['review_id']
              source_path = item['source_path']
              file_path = f"books/{source_path}"

              if not os.path.exists(file_path):
                  print(f"WARNING: {file_path} not found, skipping.")
                  continue

              if file_path.endswith('.ipynb'):
                  with open(file_path, encoding='utf-8') as f:
                      nb = json.load(f)
                  nb.setdefault('metadata', {})['nd_review_id'] = review_id
                  with open(file_path, 'w', encoding='utf-8') as f:
                      json.dump(nb, f, indent=1, ensure_ascii=False)
                      f.write('\n')
                  modified.append(item)
                  print(f"Injected {review_id} into {file_path}")

          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
              f.write(f"modified={json.dumps(modified)}\n")
          PYEOF

      - name: Check for existing auto-inject PR
        if: steps.gate.outputs.count > 0 && inputs.dry_run != true
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --state open --json number,url,headRefName --jq '[.[] | select(.headRefName | startswith("review/auto-inject-"))][0].url // empty' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            # Warn rather than log quietly: this skip leaves the new notebooks
            # without an nd_review_id, so their pages render no review badge at
            # all. Review issues still get created (that step is not gated), so
            # the only symptom is a missing badge — which went unnoticed for two
            # weeks while an auto-inject PR sat open.
            echo "::warning::An auto-inject PR is already open ($EXISTING) — skipping UUID injection. New notebooks will have NO review badge until it is merged."
            {
              echo "### Review ID injection skipped"
              echo ""
              echo "An auto-inject PR is already open: $EXISTING"
              echo ""
              echo "Merge it, then run this workflow manually (Actions > Detect new notebooks > Run workflow) so the remaining notebooks get their \`nd_review_id\`. Re-running this run would reuse its old checkout."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push branch
        if: steps.gate.outputs.count > 0 && inputs.dry_run != true && steps.check_pr.outputs.skip != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="review/auto-inject-$(date +%Y%m%d-%H%M%S)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add books/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pr_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT="${{ steps.gate.outputs.count }}"

          git commit -m "Add nd_review_id to ${COUNT} new notebook(s)

          Automatically generated by detect-new-notebooks workflow."

          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "Add review IDs to ${COUNT} new notebook(s)" \
            --body "Automatically adds \`nd_review_id\` metadata to new notebooks that were merged without one.

          _This PR was created automatically by the detect-new-notebooks workflow._" \
            --base main \
            --head "$BRANCH")

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_created=true" >> "$GITHUB_OUTPUT"

      # Intentionally NOT gated on steps.check_pr.outputs.skip: an open inject
      # PR blocks PR creation (to avoid stacking) but must NOT block issue
      # creation or its prerequisite author lookup (these are gated on CI only,
      # via the gate step's list). The reconcile step handles
      # UUID reuse if a later inject run finds an existing issue for the same
      # source_path.
      - name: Find PR authors for new notebooks
        if: steps.gate.outputs.count > 0 && inputs.dry_run != true
        id: find_authors
        uses: actions/github-script@v7
        env:
          GATED_JSON: ${{ steps.gate.outputs.gated }}
        with:
          script: |
            const { execFileSync } = require('child_process');
            const reconciled = JSON.parse(process.env.GATED_JSON);
            const enriched = [];

            for (const item of reconciled) {
              let prAuthor = null;

              if (!item.issue_exists) {
                try {
                  // execFileSync with an argv array — no shell parsing, no injection.
                  const logOutput = execFileSync(
                    'git',
                    ['log', '--diff-filter=A', '--format=%H', '--', `books/${item.source_path}`],
                    { encoding: 'utf-8' }
                  ).trim();

                  // git log is newest-first; the most recent add is the one
                  // being filed now, so take the first line.
                  const addedSha = logOutput
                    .split('\n')
                    .filter(s => s.trim())[0];

                  if (addedSha) {
                    const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      commit_sha: addedSha,
                    });

                    const pr = prs[0];
                    if (pr && pr.user) {
                      const login = pr.user.login;
                      const isBot = pr.user.type === 'Bot' || login.endsWith('[bot]');
                      if (!isBot) {
                        prAuthor = login;
                      } else {
                        core.info(`Skipping bot author ${login} for ${item.source_path}`);
                      }
                    }
                  } else {
                    core.info(`No adding commit found for ${item.source_path}`);
                  }
                } catch (err) {
                  core.warning(`Could not find PR author for ${item.source_path}: ${err.message}`);
                }
              }

              enriched.push({ ...item, pr_author: prAuthor });
            }

            core.setOutput('enriched', JSON.stringify(enriched));

      - name: Open review issues in reviews repo
        if: steps.gate.outputs.count > 0 && inputs.dry_run != true
        uses: actions/github-script@v7
        env:
          REVIEWS_REPO_OWNER: neurodesk
          REVIEWS_REPO_NAME: neurodeskedu-reviews
          ENRICHED_JSON: ${{ steps.find_authors.outputs.enriched }}
        with:
          github-token: ${{ secrets.REVIEWS_REPO_TOKEN }}
          script: |
            const enriched = JSON.parse(process.env.ENRICHED_JSON);
            const repoOwner = process.env.REVIEWS_REPO_OWNER;
            const repoName = process.env.REVIEWS_REPO_NAME;
            const failed = [];

            for (const item of enriched) {
              if (item.issue_exists) {
                core.info(
                  `Issue already exists for ${item.source_path} — ` +
                  `UUID ${item.review_id} was reused. Skipping issue creation.`
                );
                continue;
              }

              try {
                const body = [
                  `### Source path (relative to books/)`,
                  ``,
                  item.source_path,
                  ``,
                  `### Notes`,
                  ``,
                  `Automatically opened by the detect-new-notebooks workflow.`,
                  ``,
                  ``,
                  `<!-- nd-review`,
                  `review_id: ${item.review_id}`,
                  `source_path: ${item.source_path}`,
                  `-->`,
                ].join('\n');

                const { data: issue } = await github.rest.issues.create({
                  owner: repoOwner,
                  repo: repoName,
                  title: `Review: ${item.source_path}`,
                  labels: ['review:queued'],
                  body: body,
                });

                core.info(`Created issue #${issue.number} for ${item.source_path}`);

                // Post welcome comment tagging the notebook's PR author
                if (item.pr_author) {
                  try {
                    // Strip backticks from source_path so a malicious filename
                    // can't break out of the inline code span.
                    const safeSourcePath = item.source_path.replace(/`/g, '');
                    const welcomeBody =
                      `🎊 Congrats @${item.pr_author}! Your notebook ` +
                      `\`${safeSourcePath}\` is now part of NeurodeskEDU! ` +
                      `It's currently marked as unreviewed while it waits ` +
                      `for peer review. Know anyone who'd be a good fit to ` +
                      `review it? Someone familiar with the method or tooling ` +
                      `used tends to work best. Drop a name (or a few) below, ` +
                      `and @micmas will take it from there.`;

                    await github.rest.issues.createComment({
                      owner: repoOwner,
                      repo: repoName,
                      issue_number: issue.number,
                      body: welcomeBody,
                    });
                    core.info(
                      `Posted welcome comment on issue #${issue.number} ` +
                      `tagging @${item.pr_author}`
                    );
                  } catch (err) {
                    core.warning(
                      `Welcome comment failed for issue #${issue.number}: ${err.message}`
                    );
                  }
                } else {
                  core.info(
                    `No PR author identified for ${item.source_path} — ` +
                    `skipping welcome comment.`
                  );
                }
              } catch (err) {
                core.warning(
                  `Failed to create issue for ${item.source_path}: ${err.message}`
                );
                failed.push(item.source_path);
              }
              await new Promise(r => setTimeout(r, 1000));
            }

            if (failed.length > 0) {
              core.setFailed(
                `Failed to create ${failed.length} issue(s): ${failed.join(', ')}. ` +
                `Re-run this workflow to retry.`
              );
            }
