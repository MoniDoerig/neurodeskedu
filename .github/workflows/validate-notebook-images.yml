name: Validate notebook images

on:
  push:
    branches: [main]
    paths:
      - 'books/**/*.ipynb'
      - 'books/**/*.png'
      - 'books/**/*.PNG'
      - 'books/**/*.jpg'
      - 'books/**/*.jpeg'
      - 'books/**/*.gif'
      - 'books/**/*.svg'
      - 'books/**/*.webp'
      - '.github/scripts/check_notebook_images.py'
      - '.github/scripts/test_check_notebook_images.py'
      - '.github/workflows/validate-notebook-images.yml'
  pull_request:
    paths:
      - 'books/**/*.ipynb'
      - 'books/**/*.png'
      - 'books/**/*.PNG'
      - 'books/**/*.jpg'
      - 'books/**/*.jpeg'
      - 'books/**/*.gif'
      - 'books/**/*.svg'
      - 'books/**/*.webp'
      - '.github/scripts/check_notebook_images.py'
      - '.github/scripts/test_check_notebook_images.py'
      - '.github/workflows/validate-notebook-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Test validator
        run: python .github/scripts/test_check_notebook_images.py
      - name: Check notebook images
        run: python .github/scripts/check_notebook_images.py books
