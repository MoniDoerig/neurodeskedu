name: Validate notebook images

on:
  push:
    branches: [main]
    paths:
      - 'books/**/*.ipynb'
      - 'books/**/*.png'
      - 'books/**/*.PNG'
      - 'books/**/*.jpg'
      - 'books/**/*.jpeg'
      - 'books/**/*.gif'
      - 'books/**/*.svg'
      - 'books/**/*.webp'
      - '.github/scripts/check_notebook_images.py'
      - '.github/scripts/test_check_notebook_images.py'
      - '.github/workflows/validate-notebook-images.yml'
  pull_request:
    paths:
      - 'books/**/*.ipynb'
      - 'books/**/*.png'
      - 'books/**/*.PNG'
      - 'books/**/*.jpg'
      - 'books/**/*.jpeg'
      - 'books/**/*.gif'
      - 'books/**/*.svg'
      - 'books/**/*.webp'
      - '.github/scripts/check_notebook_images.py'
      - '.github/scripts/test_check_notebook_images.py'
      - '.github/workflows/validate-notebook-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test validator
        run: python .github/scripts/test_check_notebook_images.py
      - name: Check notebook images
        run: python .github/scripts/check_notebook_images.py books
