name: Validate DIPY download recovery

on:
  push:
    paths:
      - '.github/scripts/test_dipy_download.py'
      - '.github/workflows/validate-dipy-download.yml'
      - 'books/examples/diffusion_imaging/DIPY_1.ipynb'
      - 'books/examples/diffusion_imaging/DIPY_2.ipynb'
  pull_request:
    paths:
      - '.github/scripts/test_dipy_download.py'
      - '.github/workflows/validate-dipy-download.yml'
      - 'books/examples/diffusion_imaging/DIPY_1.ipynb'
      - 'books/examples/diffusion_imaging/DIPY_2.ipynb'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truncated-transfer:
    name: Resume a truncated transfer
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/scripts/test_dipy_download.py
