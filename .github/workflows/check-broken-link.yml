name: check_broken_links

# Checks every page of the published site (https://neurodesk.org/edu) for broken links.
# Pages are read from the site's own inventory, so new pages are covered automatically.
# Accepted exceptions live in .lycheeignore.

on:
  schedule:
    - cron: 30 17 * * *
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List published pages
        run: |
          curl -sSf https://neurodesk.org/edu/neurodesk-pages.json \
            | jq -r '.[] | "https://neurodesk.org/edu/" + .' > pages.txt
          echo "Checking $(wc -l < pages.txt) pages"

      - name: Check links on every page
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --no-progress
            --max-concurrency 16
            --max-retries 3
            --timeout 30
            --accept 200..=206,403,429
            --files-from pages.txt
          fail: true
