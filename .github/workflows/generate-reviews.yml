# Generate the review registry (reviews.json) from the reviews repo issues.
# Runs on dispatch from the reviews repo, or manually.

name: Generate Review Registry

on:
  # Run when dispatched from the reviews repo
  repository_dispatch:
    types: [reviews-updated]

  # Or manually
  workflow_dispatch:

concurrency:
  group: generate-reviews
  cancel-in-progress: true

jobs:
  generate:
    if: github.repository == 'neurodesk/neurodeskedu'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate review registry
        env:
          GITHUB_TOKEN: ${{ secrets.REVIEWS_REPO_TOKEN }}
        run: |
          python tools/generate_reviews_registry.py \
            --reviews-repo neurodesk/neurodeskedu-reviews \
            --out books/_static/reviews.json \
            --repo-dir .

      - name: Commit updated registry
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add books/_static/reviews.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update review registry [skip ci]"
          git pull --rebase origin main || true
          git push
