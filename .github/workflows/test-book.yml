name: Test Jupyter Book build

on:
  pull_request:
    paths:
      - 'books/**'
      - 'requirements-book.txt'
      - 'requirements-book-browser.txt'
      - '.github/scripts/*book*.py'
      - '.github/workflows/test-book.yml'
      - '.github/workflows/run_and_publish_notebooks.yml'
  push:
    branches: [main]
    paths:
      - 'books/**'
      - 'requirements-book.txt'
      - 'requirements-book-browser.txt'
      - '.github/scripts/*book*.py'
      - '.github/workflows/test-book.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-book-browser.txt
      - run: playwright install --with-deps chromium
      - name: Test metadata, redirects, and saved output rendering
        env:
          BOOK_INTEGRATION_TEST: '1'
        run: python -m unittest discover -s .github/scripts -p test_build_book.py -v
      - run: python .github/scripts/build_book.py
      - run: python .github/scripts/verify_book.py
      - name: Check downloads and navigation in a browser
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          ln -s "$GITHUB_WORKSPACE/books/_build/html" "$RUNNER_TEMP/site/edu"
          python -m http.server --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" 8000 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..20}; do
            curl --silent --fail http://127.0.0.1:8000/edu/ >/dev/null && break
            sleep 1
          done
          python .github/scripts/verify_book_browser.py http://127.0.0.1:8000/edu
